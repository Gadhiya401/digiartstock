<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>DigiArt Stock Management</title>
<style>
  :root {
    --bg:#eef1f6; --card:#fff; --line:#e3e6ea; --text:#1c2430; --muted:#6b7480;
    --primary:#2563eb; --primary-d:#1d4ed8; --danger:#dc2626; --ok:#16a34a; --warn:#f59e0b;
    --radius:14px; --nav-w:220px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1,h2,h3 { margin:0 0 .5rem; }
  button { font:inherit; cursor:pointer; }
  input,select { font:inherit; width:100%; padding:.6rem .7rem; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--text); }
  input:focus,select:focus { outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary); }
  label { display:block; font-size:.8rem; color:var(--muted); margin:.5rem 0 .25rem; font-weight:600; }
  .btn { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:.7rem 1rem; font-weight:600; width:100%; }
  .btn:active { background:var(--primary-d); }
  .btn.sec { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .btn.sm { width:auto; padding:.45rem .7rem; font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1rem; margin-bottom:.9rem; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .app { max-width:680px; margin:0 auto; padding:0 .8rem 90px; }
  header { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line);
    padding:.7rem .9rem; display:flex; align-items:center; justify-content:space-between; }
  header .brand { font-weight:700; }
  header .chip { font-size:.72rem; background:#eef2ff; color:var(--primary-d); padding:.25rem .6rem; border-radius:999px; font-weight:700; }
  header .lo { background:none; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:.8rem; padding:.35rem .6rem; }
  nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--card); border-top:1px solid var(--line);
    display:flex; max-width:680px; margin:0 auto; }
  nav.tabs .navbrand { display:none; }
  nav.tabs button { flex:1; background:none; border:none; padding:.5rem 0 .6rem; color:var(--muted); font-size:.64rem; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px; border-radius:0; }
  nav.tabs button .i { font-size:1.05rem; }
  nav.tabs button.on { color:var(--primary); }

  /* ---------- Desktop / PC layout ---------- */
  @media (min-width:900px){
    body { background:var(--bg); }
    header { padding-left:calc(var(--nav-w) + 1.5rem); }
    nav.tabs { flex-direction:column; top:0; bottom:0; right:auto; width:var(--nav-w); max-width:none; margin:0;
      border-top:none; border-right:1px solid var(--line); padding:1rem .6rem; gap:.25rem; align-items:stretch; }
    nav.tabs .navbrand { display:block; font-weight:800; font-size:1.05rem; padding:.4rem .6rem 1rem; color:var(--text); }
    nav.tabs button { flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:.7rem; padding:.7rem .8rem;
      font-size:.9rem; border-radius:10px; }
    nav.tabs button .i { font-size:1.1rem; width:1.3rem; text-align:center; }
    nav.tabs button.on { background:#eef2ff; color:var(--primary-d); }
    nav.tabs button:hover { background:#f1f3f7; }
    .app { max-width:1080px; margin:0; padding:1.5rem 2rem 2rem calc(var(--nav-w) + 3rem); }
    #dashBody .grid2, #reportBody .grid2 { grid-template-columns:repeat(4,1fr); gap:1rem; }
    .card { padding:1.25rem; }
    #toast { left:auto; right:2rem; transform:none; bottom:2rem; }
  }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th,td { text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.02em; }
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  tr.low td { background:#fef2f2; color:var(--danger); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:.8rem; }
  .stat .n { font-size:1.5rem; font-weight:700; }
  .stat .l { font-size:.72rem; color:var(--muted); font-weight:600; }

  /* dashboard */
  .dash-hero { background:linear-gradient(135deg,#2563eb,#1e40af); color:#fff; border-radius:var(--radius);
    padding:1.25rem 1.4rem; margin-bottom:1rem; box-shadow:0 8px 24px rgba(37,99,235,.25); }
  .dash-hero .hi { font-size:.8rem; opacity:.85; font-weight:600; }
  .dash-hero .big2 { font-size:1.6rem; font-weight:800; margin-top:.15rem; }
  .dash-hero .sub { font-size:.82rem; opacity:.9; margin-top:.2rem; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem;
    position:relative; overflow:hidden; }
  .tile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,#2563eb); }
  .tile .ic { font-size:1.1rem; }
  .tile .n { font-size:1.7rem; font-weight:800; line-height:1.1; margin-top:.35rem; }
  .tile .l { font-size:.74rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1rem; margin-top:1rem; }
  .panel h3 { font-size:.95rem; display:flex; justify-content:space-between; align-items:center; }
  .mini { display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid var(--line); font-size:.88rem; }
  .mini:last-child { border-bottom:none; }
  .pill { font-size:.7rem; font-weight:700; padding:.15rem .5rem; border-radius:999px; }
  .pill.in { background:#dcfce7; color:#166534; } .pill.out { background:#fef3c7; color:#92400e; }
  @media (min-width:900px){ .dash-panels { display:grid; grid-template-columns:1fr 1fr; gap:1rem; } .dash-panels .panel { margin-top:0; } }
  .muted { color:var(--muted); }
  .err { color:var(--danger); font-size:.82rem; margin-top:.4rem; }
  .row-actions { display:flex; gap:.4rem; }
  .search-list { border:1px solid var(--line); border-radius:10px; margin-top:.25rem; max-height:190px; overflow:auto; }
  .search-list div { padding:.55rem .7rem; border-bottom:1px solid var(--line); }
  .search-list div:last-child { border-bottom:none; }
  .search-list div:active { background:#eef2ff; }
  .selbox { background:#f0f7ff; border:1px solid #cfe2ff; border-radius:10px; padding:.6rem .7rem; margin-top:.3rem; font-size:.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chips button { background:#fff; border:1px solid var(--line); border-radius:999px; padding:.35rem .7rem; font-size:.8rem; color:var(--text); }
  .chips button.on { background:var(--primary); color:#fff; border-color:var(--primary); }
  .big { font-size:2rem; font-weight:700; }
  #toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:.4rem; width:92%; max-width:520px; }
  .toast { padding:.7rem .9rem; border-radius:10px; color:#fff; font-size:.88rem; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  .toast.ok { background:var(--ok); } .toast.bad { background:var(--danger); } .toast.info { background:#334155; }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
  .spin { display:inline-block; width:18px; height:18px; border:3px solid #cbd5e1; border-top-color:var(--primary); border-radius:50%; animation:sp .7s linear infinite; vertical-align:middle; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .loading { text-align:center; color:var(--muted); padding:1.5rem; }
  .hide { display:none !important; }

  /* print orders */
  textarea { font:inherit; width:100%; padding:.6rem .7rem; border:1px solid var(--line); border-radius:10px;
    background:#fff; color:var(--text); resize:vertical; }
  textarea:focus { outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary); }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; }
  .stat.tap { cursor:pointer; }
  .stat.tap:active { background:#f1f3f7; }
  .badge { display:inline-block; min-width:1.2rem; text-align:center; background:var(--danger); color:#fff;
    border-radius:999px; font-size:.65rem; font-weight:700; padding:0 .3rem; margin-left:.25rem; line-height:1.2rem; }
  .chips button.on .badge { background:#fff; color:var(--primary); }
  .po { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius:var(--radius); padding:.8rem .9rem; margin-bottom:.6rem; }
  .po.red { background:#fef2f2; border-color:#fecaca; border-left-color:var(--danger); }
  .po.orange { background:#fff7ed; border-color:#fed7aa; border-left-color:#ea580c; }
  .po .top { display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; }
  .po .mob { font-size:1.15rem; font-weight:800; color:var(--text); text-decoration:none; margin-right:auto; }
  .po .det { white-space:pre-wrap; margin:.35rem 0; }
  .po .meta { font-size:.78rem; color:var(--muted); }
  .po .alert { font-weight:800; color:var(--danger); font-size:.82rem; margin-top:.2rem; }
  .po .alert.or { color:#c2410c; }
  .po .acts { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
  .po .courier { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; margin-top:.6rem; }
  .po .trk { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:.45rem .6rem; margin-top:.4rem; font-size:.88rem; }
  .pill.br-d { background:#dbeafe; color:#1e40af; } .pill.br-u { background:#f3e8ff; color:#6b21a8; }
  .pill.s-pending { background:#fee2e2; color:#991b1b; } .pill.s-courier_pending { background:#ffedd5; color:#9a3412; }
  .pill.s-dispatched { background:#dcfce7; color:#166534; } .pill.s-cancelled { background:#e5e7eb; color:#374151; }
  .pill.urgent { background:var(--danger); color:#fff; }
  .po-h { font-size:.95rem; margin:1rem 0 .5rem; }
  /* Orders sub-menu: sidebar on PC, chips on phone */
  nav.tabs .subnav { display:none; }
  @media (min-width:900px){
    nav.tabs .subnav { display:flex; flex-direction:column; gap:.1rem; margin:0 0 .3rem 1.4rem; padding-left:.5rem; border-left:2px solid var(--line); }
    nav.tabs .subnav button { padding:.45rem .7rem; font-size:.85rem; }
    nav.tabs .subnav button .badge { margin-left:auto; }
    #poTabs { display:none; }
  }
</style>
</head>

<!-- LOGIN -->
<div id="loginView" class="center hide">

<!-- APP -->
<div id="appView" class="hide">
  <header>
    <span class="brand">📦 DigiArt Stock Management</span>
    <span style="display:flex;align-items:center;gap:.5rem;">
      <span class="chip" id="branchChip">—</span>
      <button class="lo" id="logoutBtn">Logout</button>

  </header>

  <div class="app">
    <!-- DASHBOARD -->
    <section data-page="dash">
      <h2>Dashboard</h2>

    <section data-page="products" class="hide">

      <div class="card">

    <!-- PRINT ORDERS -->

<script>
"use strict";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (Math.round((Number(n)||0)*100)/100).toLocaleString();
// local-date YYYY-MM-DD (toISOString() is UTC and shifts the day back in IST)
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayISO = () => isoLocal(new Date());

function toast(msg,kind="info",ms=3000){
  const el=document.createElement("div");
  el.className="toast "+({ok:"ok",bad:"bad"}[kind]||"info");
  el.textContent=msg; $("#toast").appendChild(el);
  setTimeout(()=>el.remove(),ms);
}

const state = { user:null, profile:null, branch:null, branches:[], page:"dash" };
// branch | printing | packing  (profiles.role, see print_orders.sql)
const role = () => state.profile?.role || "branch";
const whoLabel = () => state.branch ? state.branch.name
  : ({printing:"Printing", packing:"Packing"}[role()] || "No branch");

/* ---------------- Auth ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show("login"); return; }
  await loadIdentity(session.user);
}
async function loadIdentity(user){
  state.user = user;
  const [{ data:branches }, { data:profile }] = await Promise.all([
    sb.from("branches").select("*"),
    sb.from("profiles").select("*").eq("id",user.id).single()
  ]);
  state.branches = branches||[];
  state.profile = profile||null;
  state.branch = state.branches.find(b=>b.id===profile?.branch_id) || null;
  if(!state.branch && role()==="branch"){
    toast("Your login is not linked to a branch. See SETUP.md","bad",6000);
  }
  $("#branchChip").textContent = whoLabel();
  // printing / packing logins have no branch, so no stock IN/OUT for them
  $$('#tabs [data-go="in"],#tabs [data-go="out"]').forEach(b=>b.classList.toggle("hide",role()!=="branch"));
  show("app");
  buildInForm(); buildOutForm();

/* ---------------- Data helpers ---------------- */
async function getStockView(){
  const [{ data, error }, { data:off }] = await Promise.all([
    sb.from("v_product_stock").select("*").order("product_no"),
    sb.from("products").select("id").eq("is_active",false)
  ]);
  if(error){ toast(error.message,"bad"); return []; }
  // removed products are hidden (is_active=false) but their history stays
  const hidden = new Set((off||[]).map(p=>p.id));
  return (data||[]).filter(r=>!hidden.has(r.product_id));
}
// filter by number/name; exact number first, then number starts-with, then contains, then name match
function searchProducts(rows,q){
  if(!q) return rows;
  const rank = r => {
    const no=r.product_no.toLowerCase(), noNum=no.replace(/^0+(?=.)/,""), qNum=q.replace(/^0+(?=.)/,"");
    if(no===q || noNum===qNum) return 0;
    if(no.startsWith(q) || noNum.startsWith(qNum)) return 1;
    if(no.includes(q)) return 2;
    return r.name.toLowerCase().includes(q) ? 3 : -1;
  };
  return rows.map(r=>[rank(r),r]).filter(([k])=>k>=0)
    .sort((a,b)=>a[0]-b[0] || a[1].product_no.localeCompare(b[1].product_no,undefined,{numeric:true}))
    .map(([,r])=>r);
}
function branchCode(id){ return state.branches.find(b=>b.id===id)?.code || ""; }
function branchIdByCode(code){ return state.branches.find(b=>b.code===code)?.id || null; }

/* ---------------- Product picker (shared by IN/OUT/Check) ---------------- */
function productPicker(prefix){
  // returns {get:()=>selectedStockRow|null, reset, mount}
  let selected=null; let rows=[];
  const wrap=document.createElement("div");
  wrap.innerHTML=`
    <label>Product (search by number)</label>
    <input id="${prefix}Search" placeholder="Type product number or name…" autocomplete="off" />
    <div class="search-list hide" id="${prefix}List"></div>
    <div class="selbox hide" id="${prefix}Sel"></div>`;
  const input=()=>$("#"+prefix+"Search",wrap);
  const listEl=()=>$("#"+prefix+"List",wrap);
  const selEl=()=>$("#"+prefix+"Sel",wrap);
  async function ensure(){ if(!rows.length) rows=await getStockView(); }
  input().addEventListener("input", async ()=>{
    selected=null; selEl().classList.add("hide");
    const q=input().value.trim().toLowerCase();
    if(!q){ listEl().classList.add("hide"); return; }
    await ensure();
    const m=searchProducts(rows,q).slice(0,20);
    listEl().innerHTML = m.map(r=>`<div data-id="${r.product_id}"><b>${esc(r.product_no)}</b> — ${esc(r.name)}<br><span class="muted">Stock: ${fmt(r.current_stock)} ${esc(r.unit||'')}</span></div>`).join("") || `<div class="muted">No match</div>`;
    listEl().classList.remove("hide");
  });
  listEl().addEventListener("click", e=>{
    const d=e.target.closest("[data-id]"); if(!d) return;
    selected=rows.find(r=>r.product_id===d.dataset.id);
    listEl().classList.add("hide"); input().value=selected.product_no;
    selEl().innerHTML=`<b>${esc(selected.name)}</b><br>Current stock: <b>${fmt(selected.current_stock)}</b> ${esc(selected.unit||'')}
      &nbsp;·&nbsp; DigiArt OUT ${fmt(selected.out_digiart)} · UV OUT ${fmt(selected.out_uvinvite)}`;
    selEl().classList.remove("hide");
  });
  return {
    node:wrap,
    get:()=>selected,
    async refresh(){ rows=await getStockView(); if(selected) selected=rows.find(r=>r.product_id===selected.product_id)||selected; },
    reset(){ selected=null; input().value=""; listEl().classList.add("hide"); selEl().classList.add("hide"); }
  };
}

async function saveMove(type){
  const p = type==="IN"?"in":"out";
  const picker = type==="IN"?inPicker:outPicker;
  const errEl=$("#"+p+"Err"); errEl.textContent="";
  const sel=picker.get();
  const qty=Number($("#"+p+"Qty").value);
  const date=$("#"+p+"Date").value||todayISO();
  if(!sel){ errEl.textContent="Pick a product first"; return; }
  if(!qty||qty<=0){ errEl.textContent="Enter a valid quantity"; return; }
  if(type==="OUT"){
    if(!state.branch){ errEl.textContent="Your login is not linked to a branch — cannot record OUT"; return; }
    // re-check live stock
    await picker.refresh();
    const live=picker.get();
    if(qty > Number(live.current_stock)){
      errEl.textContent=`Not enough stock. Available: ${fmt(live.current_stock)} ${live.unit||''}`;
      return;
    }
  }
  const rec = {
    product_id: sel.product_id, move_type:type, qty,
    branch_id: type==="OUT" ? state.branch.id : null,
    party: $("#"+p+"Party").value.trim()||null,
    note: $("#"+p+"Note").value.trim()||null,
    created_by: state.user.id,
    move_date: date
  };
  $("#"+p+"Save").disabled=true;
  const { error } = await sb.from("stock_moves").insert(rec);
  $("#"+p+"Save").disabled=false;
  if(error){ errEl.textContent=error.message; return; }
  toast(`${type} entry saved`,"ok");
  picker.reset();
  $("#"+p+"Qty").value=""; $("#"+p+"Party").value=""; $("#"+p+"Note").value="";
}

// [from,to] as local YYYY-MM-DD for a date chip (today/yday/week/month/lastmonth/custom)
function rangeOf(key,fromEl,toEl){
  const d=new Date(); d.setHours(0,0,0,0);
  const iso=isoLocal;
  const s=new Date(d);
  if(key==="today") return [iso(d),iso(d)];
  if(key==="yday"){ s.setDate(s.getDate()-1); return [iso(s),iso(s)]; }
  if(key==="week"){ s.setDate(s.getDate()-((s.getDay()+6)%7)); return [iso(s),iso(d)]; }
  if(key==="month"){ s.setDate(1); return [iso(s),iso(d)]; }
  if(key==="lastmonth"){
    const a=new Date(d.getFullYear(),d.getMonth()-1,1);
    const b=new Date(d.getFullYear(),d.getMonth(),0);
    return [iso(a),iso(b)];
  }
  return [fromEl.value||iso(d), toEl.value||iso(d)];
}

function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(c=>{
    const s=String(c??""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------------- Print Orders ---------------- */
const PO_PARTNERS = { anjani:"Anjani", delhivery:"Delhivery", post:"Post", other:"Other" };
const PO_STATUS = { pending:"Pending", courier_pending:"Courier Pending", dispatched:"Dispatched", cancelled:"Cancelled" };
const DAY_MS = 864e5;
const po = { orders:[], loaded:false, tab:null, editId:null, names:{}, searchTimer:null };

const branchName = id => state.branches.find(b=>b.id===id)?.name || "—";
const branchPill = id => `<span class="pill ${branchCode(id)==="UVINVITE"?"br-u":"br-d"}">${esc(branchName(id))}</span>`;
const fmtMobile = m => m.length===10 ? m.slice(0,5)+" "+m.slice(5) : m;
const ddmmyyyy = s => s ? s.split("-").reverse().join("-") : "";
const istParts = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});
// "14-10-2026, 09:30 AM" in IST
function dtIST(d){
  const p=Object.fromEntries(istParts.formatToParts(new Date(d)).map(x=>[x.type,x.value]));
  return `${p.day}-${p.month}-${p.year}, ${p.hour}:${p.minute} ${(p.dayPeriod||"").toUpperCase()}`;
}
function ago(d){
  const m=Math.floor((Date.now()-new Date(d))/60000);
  if(m<1) return "just now"; if(m<60) return m+" min ago";
  const h=Math.floor(m/60); return h<48 ? h+"h ago" : Math.floor(h/24)+" days ago";
}
const lateP = o => o.status==="pending" && Date.now()-new Date(o.created_at) > DAY_MS;
const lateC = o => o.status==="courier_pending" && Date.now()-new Date(o.printed_at||o.created_at) > DAY_MS;
const urgent = o => o.needed_by && (o.status==="pending"||o.status==="courier_pending") && o.needed_by<=todayISO();
const partnerName = o => o.courier_partner==="other" ? (o.courier_other||"Other") : (PO_PARTNERS[o.courier_partner]||"");
const ofStatus = s => po.orders.filter(o=>o.status===s);
// printing staff pack the parcels too, so both roles can enter tracking IDs
const canPack = () => role()==="printing" || role()==="packing";
const mineBranch = o => role()==="branch" && o.branch_id===state.branch?.id;

function upsertOrder(row){
  const i=po.orders.findIndex(o=>o.id===row.id);
  if(i>=0) po.orders[i]=row; else po.orders.push(row);
}
async function loadOrders(){
  // all open orders + everything from the last 60 days (older ones come via search)
  const since=isoLocal(new Date(Date.now()-60*DAY_MS));
  const [{ data, error }, { data:profs }] = await Promise.all([
    sb.from("print_orders").select("*").or(`status.in.(pending,courier_pending),created_at.gte.${since}`).order("created_at"),
    sb.from("profiles").select("id,display_name")
  ]);
  if(error){
    $("#poList").innerHTML=`<div class="card err">${esc(error.message)}<br>Run print_orders.sql in Supabase (see SETUP.md).</div>`;
    $("#poListWrap").classList.remove("hide");
    return;
  }
  po.orders=data||[]; po.loaded=true;
  po.names=Object.fromEntries((profs||[]).map(p=>[p.id,p.display_name]));
}
function initOrders(){
  po.tab = role()==="branch" ? "new" : role()==="packing" ? "courier" : "pending";
  loadOrders().then(renderOrders);
  sb.channel("print_orders").on("postgres_changes",{event:"*",schema:"public",table:"print_orders"}, p=>{
    if(!po.loaded || !p.new?.id) return;
    const isNew = p.eventType==="INSERT" && !po.orders.some(o=>o.id===p.new.id);
    upsertOrder(p.new);
    if(isNew && role()==="printing") toast(`New print order — ${branchName(p.new.branch_id)}`,"info",5000);
    renderOrders();
  }).subscribe();
  setInterval(()=>{ if(po.loaded) renderOrders(); }, 60000);   // keep 24h colours and "x h ago" fresh
}
async function showOrders(){
  if(!po.loaded){ $("#poList").innerHTML='<div class="loading"><span class="spin"></span> Loading…</div>'; await loadOrders(); }
  renderOrders();
}

function renderOrders(){
  if(!po.loaded) return;
  const pend=ofStatus("pending"), cp=ofStatus("courier_pending");
  const redP=pend.filter(lateP).length, redC=cp.filter(lateC).length;
  const dispToday=ofStatus("dispatched").filter(o=>isoLocal(new Date(o.dispatched_at))===todayISO()).length;

    <div class="stat tap" data-tab="pending"><div class="n" style="color:${redP?'var(--danger)':'inherit'}">${pend.length}</div>
      <div class="l">Pending (printing baki)${redP?` · <span style="color:var(--danger)">${redP} red</span>`:""}</div></div>
    <div class="stat tap" data-tab="courier"><div class="n" style="color:${redC?'#c2410c':'inherit'}">${cp.length}</div>
      <div class="l">Courier Pending (tracking baki)${redC?` · <span style="color:#c2410c">${redC} late</span>`:""}</div></div>
    <div class="stat tap" data-tab="dispatched"><div class="n" style="color:var(--ok)">${dispToday}</div>
      <div class="l">Dispatched today</div></div>`;

  const tabs=[...(role()==="branch"?[["new","+ New Entry",0]]:[]),
    ["pending","Pending",pend.length],["courier","Courier Pending",cp.length],
    ["dispatched","Dispatched",0],["cancelled","Cancelled",0],["all","All / Search",0],["report","📊 Report",0]];
  // same options as chips (phone) and as a sub-menu under Orders in the sidebar (PC)
  const tabHtml=tabs.map(([k,l,n])=>
    `<button data-tab="${k}" class="${po.tab===k?"on":""}">${l}${n?`<span class="badge">${n}</span>`:""}</button>`).join("");
  $("#poTabs").innerHTML=tabHtml;
  $("#poSubnav").innerHTML=tabHtml;

  $("#poNew").classList.toggle("hide",po.tab!=="new");
  $("#poListWrap").classList.toggle("hide",po.tab==="new"||po.tab==="report");
  $("#poReport").classList.toggle("hide",po.tab!=="report");
  if(po.tab==="report"){ if(!po.reportRan) runOrderReport(); return; }
  $("#poStatus").classList.toggle("hide",po.tab!=="all");
  if(po.tab==="new"){
    $("#poBranchBox").innerHTML = state.branch ? `Branch (from your login): <b>${esc(state.branch.name)}</b>`
      : `<span class="err">Your login is not linked to a branch — cannot add entries</span>`;
    // entry time is stamped by the server on save; this just shows it (original time when editing)
    const editing=po.orders.find(o=>o.id===po.editId);
    $("#poNow").value=dtIST(editing ? editing.created_at : new Date());
    return;
  }
  renderOrderList();

// search rank, lower = closer match; -1 = no match
// mobile: exact > ends with (last digits) > starts with > anywhere; then details text
function poRank(o,q){
  const digits=q.replace(/\D/g,""), det=o.details.toLowerCase();
  if(digits && /^[\d\s+()-]+$/.test(q)){
    const d=digits.length>10 && digits.startsWith("91") ? digits.slice(-10) : digits;
    if(o.mobile===d) return 0;
    if(o.mobile.endsWith(d)) return 1;
    if(o.mobile.startsWith(d)) return 2;
    if(o.mobile.includes(d)) return 3;
  }
  if(det.startsWith(q)) return 4;
  if((" "+det).replace(/[^a-z0-9઀-૿]+/g," ").includes(" "+q)) return 5;   // starts a word
  return det.includes(q) ? 6 : -1;
}
const poMatch = (o,q) => !q || poRank(o,q)>=0;
// while searching, closest matches first; otherwise (and for ties) the list's normal order
const rankSort = (arr,q,cmp) => arr.sort((a,b)=> (q ? poRank(a,q)-poRank(b,q) : 0) || cmp(a,b));
function renderOrderList(){
  // keep what packing has typed (and focus) across re-renders from realtime / timer
  const keep={};
  $$("#poList .po").forEach(c=>{ keep[c.dataset.id]=Object.fromEntries($$("[data-f]",c).map(i=>[i.dataset.f,i.value])); });
  const act=document.activeElement, focusId=act?.closest?.(".po")?.dataset.id, focusF=act?.dataset?.f;

  const q=$("#poSearch").value.trim().toLowerCase();
  const list=po.orders.filter(o=>poMatch(o,q));
  const by=(k,dir=1)=>(a,b)=>dir*(new Date(a[k]||0)-new Date(b[k]||0));
  const cards=arr=>arr.map(poCard).join("");
  let html="";
  if(po.tab==="pending"){
    const l=list.filter(o=>o.status==="pending").sort(by("created_at"));
    html=cards(l)||`<div class="card muted">Nothing pending for printing 🎉</div>`;
  } else if(po.tab==="courier"){
    const l=list.filter(o=>o.status==="courier_pending").sort(by("printed_at"));
    const quick = canPack() && l.length ? `<div class="card" style="padding:.7rem;">
        <div class="muted" style="font-size:.82rem;margin-bottom:.4rem;">Quick entry: type each tracking ID and press Enter to jump to the next one, then save all.</div>
        <button class="btn" id="poSaveAll">Save all filled</button></div>` : "";
    html=`${quick}${cards(l)||`<div class="card muted">No parcels waiting</div>`}`;
  } else if(po.tab==="dispatched"){
    const l=rankSort(list.filter(o=>o.status==="dispatched"),q,by("dispatched_at",-1));
    html=cards(l)||`<div class="card muted">Nothing dispatched yet</div>`;
  } else if(po.tab==="cancelled"){
    const l=rankSort(list.filter(o=>o.status==="cancelled"),q,by("updated_at",-1));
    html=cards(l)||`<div class="card muted">No cancelled orders</div>`;
  } else {
    const st=$("#poStatus").value;
    const l=rankSort(list.filter(o=>st==="all"||o.status===st),q,by("created_at",-1));
    html=cards(l)||`<div class="card muted">No orders${q?" for this search":""}</div>`;
  }
  $("#poList").innerHTML=html;

  for(const [id,f] of Object.entries(keep)){
    const c=$(`#poList .po[data-id="${id}"]`); if(!c) continue;
    for(const [k,v] of Object.entries(f)){ const i=$(`[data-f="${k}"]`,c); if(i && v) i.value=v; }
    togglePartnerOther(c);
  }
  if(focusId && focusF) $(`#poList .po[data-id="${focusId}"] [data-f="${focusF}"]`)?.focus();
}

function poCard(o){
  const name=id=>po.names[id]?` by ${esc(po.names[id])}`:"";
  const lp=lateP(o), lc=lateC(o), r=role();
  const meta=[`Entry: ${dtIST(o.created_at)} · ${ago(o.created_at)}${name(o.created_by)}`];
  if(o.printed_at) meta.push(`Print done: ${dtIST(o.printed_at)}${o.status==="courier_pending"?" · "+ago(o.printed_at):""}${name(o.printed_by)}`);
  if(o.dispatched_at) meta.push(`Dispatched: ${dtIST(o.dispatched_at)}${name(o.dispatched_by)}`);
  if(o.needed_by) meta.push(`Needed by: ${ddmmyyyy(o.needed_by)}`);

  let body="", acts=[];
  const canCancel = (o.status==="pending"||o.status==="courier_pending") && (mineBranch(o)||r==="printing"||r==="packing");
  if(o.status==="pending"){
    if(r==="printing") acts.push(`<button class="btn" data-act="print">✓ Print Done</button>`);
    if(mineBranch(o)) acts.push(`<button class="btn sec sm" data-act="edit">Edit</button>`);
  }
  if(o.status==="courier_pending"){
    if(canPack()){
      body=`<div class="courier">
        <select data-f="partner">
          ${Object.entries(PO_PARTNERS).map(([k,v])=>`<option value="${k}" ${(o.courier_partner||"anjani")===k?"selected":""}>${v}</option>`).join("")}</select>
        <input data-f="tracking" placeholder="Tracking ID (Anjani: 10 digits)" autocomplete="off" value="${esc(o.tracking_id||"")}" />
        <input data-f="other" class="hide" placeholder="Partner name" style="grid-column:1/-1" value="${esc(o.courier_other||"")}" />
      </div><div class="err" data-err></div>`;
      acts.push(`<button class="btn" data-act="dispatch">🚚 Save / Dispatch</button>`);
    }
    if(r==="printing") acts.push(`<button class="btn sec sm" data-act="unprint">↩ Undo Print Done</button>`);
  }
  if(o.status==="dispatched"){
    body=`<div class="trk">🚚 <b>${esc(partnerName(o))}</b> · Tracking ID: <b>${esc(o.tracking_id)}</b>
      ${trackUrl(o)?` · <a href="${esc(trackUrl(o))}" target="_blank" rel="noopener">Track ↗</a>`:""}</div>`;
    acts.push(`<button class="btn sm" data-act="copy">📋 Copy details</button>`);
    acts.push(`<a class="btn sec sm" style="text-decoration:none;" target="_blank" rel="noopener" href="https://wa.me/91${o.mobile}?text=${encodeURIComponent(courierText(o))}">WhatsApp</a>`);
    if(canPack()) acts.push(`<button class="btn sec sm" data-act="undispatch">↩ Undo Dispatch</button>`);
  }
  if(o.status==="cancelled"){
    body=`<div class="trk" style="background:#f3f4f6;border-color:#e5e7eb;">Cancelled: ${esc(o.cancel_reason)}</div>`;
    if(mineBranch(o)||r==="printing") acts.push(`<button class="btn sec sm" data-act="restore">Restore</button>`);
  }
  if(canCancel) acts.push(`<button class="btn sec sm" data-act="cancel" style="color:var(--danger);border-color:var(--danger);">Cancel</button>`);

  const alert = lp ? `<div class="alert">⚠ ${esc(branchName(o.branch_id))} — 24h+ pending</div>`
              : lc ? `<div class="alert or">⚠ ${esc(branchName(o.branch_id))} — Print done, tracking ID baki (24h+)</div>` : "";
  return `<div class="po ${lp?"red":lc?"orange":""}" data-id="${o.id}">
    <div class="top">
      <a class="mob" href="tel:+91${o.mobile}">📞 ${fmtMobile(o.mobile)}</a>
      ${branchPill(o.branch_id)}
      <span class="pill s-${o.status}">${PO_STATUS[o.status]}</span>
      ${urgent(o)?`<span class="pill urgent">Urgent</span>`:""}
    </div>
    ${alert}
    <div class="det">${esc(o.details)}</div>
    <div class="meta">${meta.join("<br>")}</div>
    ${body}
    ${acts.length?`<div class="acts">${acts.join("")}</div>`:""}
  </div>`;
}

const trackUrl = o => o.courier_partner==="anjani" ? `https://shreeanjani.co.in/tracking?awb=${encodeURIComponent(o.tracking_id)}` : "";
// ready-to-send dispatch message (Copy button + WhatsApp)
function courierText(o){
  return [
    `Namaste! Your order from ${branchName(o.branch_id)} has been dispatched 🚚`,
    ``,
    `Order: ${o.details}`,
    `Mobile: ${fmtMobile(o.mobile)}`,
    `Courier: ${partnerName(o)}`,
    `Tracking ID: ${o.tracking_id}`,
    `Dispatched: ${dtIST(o.dispatched_at)}`,
    ...(trackUrl(o) ? [`Track here: ${trackUrl(o)}`] : [])
  ].join("\n");
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch {
    // fallback for browsers without clipboard API permission
    const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false; try { ok=document.execCommand("copy"); } catch {}
    ta.remove(); return ok;
  }
}

async function poUpdate(id,patch,render=true){
  const { data, error } = await sb.from("print_orders").update(patch).eq("id",id).select().single();
  if(error){ toast(error.message,"bad",5000); return false; }
  upsertOrder(data);
  if(render) renderOrders();
  return true;
}
function togglePartnerOther(card){
  const other=$('[data-f="other"]',card); if(!other) return;
  other.classList.toggle("hide",$('[data-f="partner"]',card).value!=="other");
}
// read + validate one courier card; returns patch or null (and shows the error on the card)
function courierPatch(card){
  const v=f=>$(`[data-f="${f}"]`,card).value.trim();
  const partner=v("partner"), other=v("other");
  const tracking = partner==="anjani" ? v("tracking").replace(/\s/g,"") : v("tracking");   // pasted "12345 67890"
  const err=$("[data-err]",card); err.textContent="";
  let msg="";
  if(!tracking) msg="Enter the tracking ID";
  else if(!partner) msg="Pick the courier partner";
  else if(partner==="anjani" && !/^\d{10}$/.test(tracking)) msg=`Anjani tracking ID must be exactly 10 digits (you entered ${tracking.length})`;
  else if(partner==="other" && !other) msg="Type the partner name";
  if(msg){ err.textContent=msg; return null; }
  return { status:"dispatched", courier_partner:partner, courier_other:partner==="other"?other:null, tracking_id:tracking };
}

      .or(`mobile.ilike.*${q}*,details.ilike.*${q}*`).order("created_at",{ascending:false}).limit(100);

$("#poList").addEventListener("change", e=>{ if(e.target.dataset.f==="partner") togglePartnerOther(e.target.closest(".po")); });
$("#poList").addEventListener("keydown", e=>{
  if(e.key!=="Enter" || e.target.dataset.f!=="tracking") return;
  e.preventDefault();
  const all=$$('#poList [data-f="tracking"]'), i=all.indexOf(e.target);
  (all[i+1]||$("#poSaveAll"))?.focus();
});
$("#poList").addEventListener("click", async e=>{
  if(e.target.id==="poSaveAll"){
    const cards=$$("#poList .po").filter(c=>$('[data-f="tracking"]',c)?.value.trim());
    if(!cards.length){ toast("No tracking IDs filled","bad"); return; }
    const jobs=cards.map(c=>[c.dataset.id,courierPatch(c)]).filter(([,patch])=>patch);
    e.target.disabled=true;
    let ok=0;
    for(const [id,patch] of jobs) if(await poUpdate(id,patch,false)) ok++;
    e.target.disabled=false;
    renderOrders();
    toast(`${ok} parcel${ok===1?"":"s"} dispatched`+(cards.length>ok?` · ${cards.length-ok} need fixing`:""), ok===cards.length?"ok":"bad");
    return;
  }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const card=b.closest(".po"), id=card.dataset.id, o=po.orders.find(x=>x.id===id); if(!o) return;
  const act=b.dataset.act;
  if(act==="print"){ b.disabled=true; if(await poUpdate(id,{status:"courier_pending"})) toast("Print done ✓","ok"); else b.disabled=false; }
  if(act==="unprint" && confirm("Move this order back to Pending (print not done)?")) poUpdate(id,{status:"pending"});
  if(act==="dispatch"){
    const patch=courierPatch(card); if(!patch) return;
    b.disabled=true; if(await poUpdate(id,patch)) toast("Dispatched 🚚","ok"); else b.disabled=false;
  }
  if(act==="undispatch" && confirm("Move this order back to Courier Pending?")) poUpdate(id,{status:"courier_pending"});
  if(act==="copy"){
    if(await copyText(courierText(o))){ b.textContent="✓ Copied"; setTimeout(()=>{ b.textContent="📋 Copy details"; },1500); }
    else toast("Could not copy — please copy manually","bad");
  }
  if(act==="cancel"){
    const reason=prompt(`Cancel order for ${fmtMobile(o.mobile)}?\nReason:`);
    if(reason?.trim()) poUpdate(id,{status:"cancelled",cancel_reason:reason.trim()});
  }
  if(act==="restore" && confirm("Restore this order to Pending?")) poUpdate(id,{status:"pending"});
  if(act==="edit"){
    po.editId=id; po.tab="new";
    $("#poMobile").value=o.mobile; $("#poDetails").value=o.details;
    $("#poFormTitle").textContent="Edit print entry"; $("#poCancelEdit").classList.remove("hide");
    renderOrders(); window.scrollTo({top:0,behavior:"smooth"});
  }
});

function resetOrderForm(){
  po.editId=null;
  $("#poMobile").value=""; $("#poDetails").value=""; $("#poErr").textContent="";
  $("#poFormTitle").textContent="New print entry"; $("#poCancelEdit").classList.add("hide");
}
$("#poCancelEdit").onclick = ()=>{ resetOrderForm(); po.tab="pending"; renderOrders(); };
$("#poSave").onclick = async ()=>{
  const err=$("#poErr"); err.textContent="";
  let mobile=$("#poMobile").value.replace(/\D/g,"");
  if(mobile.length===12 && mobile.startsWith("91")) mobile=mobile.slice(2);
  else if(mobile.length===11 && mobile.startsWith("0")) mobile=mobile.slice(1);
  const details=$("#poDetails").value.trim();
  if(!state.branch){ err.textContent="Your login is not linked to a branch"; return; }
  if(!/^\d{10}$/.test(mobile)){ err.textContent="Enter a valid 10-digit mobile number"; return; }
  if(!details){ err.textContent="Enter what to print"; return; }
  const open=po.orders.filter(o=>o.mobile===mobile && o.id!==po.editId && (o.status==="pending"||o.status==="courier_pending"));
  if(open.length && !confirm(`${fmtMobile(mobile)} already has ${open.length} open order(s):\n\n${open.map(o=>"• "+o.details.slice(0,60)).join("\n")}\n\nSave this one too?`)) return;

  $("#poSave").disabled=true;
  let ok;
  if(po.editId) ok=await poUpdate(po.editId,{mobile,details},false);
  else {
    const { data, error } = await sb.from("print_orders")
      .insert({ branch_id:state.branch.id, mobile, details, created_by:state.user.id }).select().single();
    if(error) err.textContent=error.message; else upsertOrder(data);
    ok=!error;
  }
  $("#poSave").disabled=false;
  if(!ok) return;
  toast(po.editId?"Entry updated":"Saved — sent to printing ✓","ok");
  const wasEdit=!!po.editId;
  resetOrderForm();
  if(wasEdit) po.tab="pending";
  renderOrders();
  if(!wasEdit) $("#poMobile").focus();
};

/* ---------------- Print Orders report ---------------- */
let poRRange="month";
$("#poRChips").onclick = e=>{
  const b=e.target.closest("button"); if(!b) return;
  poRRange=b.dataset.r;
  $$("#poRChips button").forEach(x=>x.classList.toggle("on",x===b));
  if(poRRange==="custom" && !$("#poRFrom").value && !$("#poRTo").value) $("#poRFrom").value=$("#poRTo").value=todayISO();
  $("#poRCustom").classList.toggle("hide",poRRange!=="custom");
  if(poRRange!=="custom") runOrderReport();
};
$("#poRRun").onclick = ()=>runOrderReport();
$("#poRBy").onchange = $("#poRBranch").onchange = ()=>runOrderReport();
const hrs = ms => { const h=ms/36e5; return h<1 ? Math.round(h*60)+" min" : h<48 ? (Math.round(h*10)/10)+" h" : (Math.round(h/2.4)/10)+" days"; };

async function runOrderReport(){
  po.reportRan=true;
  const body=$("#poRBody");
  // branch filter only for printing/packing; branch logins only ever see their own branch
  const bsel=$("#poRBranch");
  if(bsel.options.length===1) state.branches.forEach(b=>bsel.add(new Option(b.name,b.id)));
  $("#poRBranchWrap").classList.toggle("hide",role()==="branch");

  const [from,to]=rangeOf(poRRange,$("#poRFrom"),$("#poRTo"));
  if(from>to){ toast("From date is after To date","bad"); return; }
  const col=$("#poRBy").value;
  body.innerHTML='<div class="loading"><span class="spin"></span> Running…</div>';
  let q=sb.from("print_orders").select("*")
    .gte(col,`${from}T00:00:00+05:30`).lte(col,`${to}T23:59:59.999+05:30`)   // IST day boundaries
    .order(col,{ascending:false}).limit(5000);
  if(bsel.value!=="all" && role()!=="branch") q=q.eq("branch_id",bsel.value);
  const { data, error } = await q;
  if(error){ body.innerHTML=`<div class="card err">${esc(error.message)}</div>`; return; }
  const rows=data||[];
  const cnt=(arr,st)=>arr.filter(o=>o.status===st).length;
  const printed=arr=>arr.filter(o=>o.printed_at).length;
  const avg=(arr,a,b)=>{ const v=arr.filter(o=>o[a]&&o[b]).map(o=>new Date(o[b])-new Date(o[a])); return v.length?hrs(v.reduce((x,y)=>x+y,0)/v.length):"—"; };
  const late=rows.filter(o=>lateP(o)||lateC(o)).length;
  const byBranch=state.branches.map(b=>[b.name,rows.filter(o=>o.branch_id===b.id)]).filter(([,r])=>r.length);
  const disp=rows.filter(o=>o.status==="dispatched");
  const byCourier=Object.entries(disp.reduce((m,o)=>{ const k=partnerName(o)||"—"; m[k]=(m[k]||0)+1; return m; },{})).sort((a,b)=>b[1]-a[1]);
  const byLabel={created_at:"Entry date",printed_at:"Print done date",dispatched_at:"Dispatch date"}[col];

  body.innerHTML=`
    <div class="grid3">
      <div class="stat"><div class="n">${rows.length}</div><div class="l">Total orders</div></div>
      <div class="stat"><div class="n">${printed(rows)}</div><div class="l">Printed</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${disp.length}</div><div class="l">Dispatched</div></div>
      <div class="stat"><div class="n" style="color:var(--danger)">${cnt(rows,"pending")}</div><div class="l">Print pending${late?` · ${late} late`:""}</div></div>
      <div class="stat"><div class="n" style="color:#c2410c">${cnt(rows,"courier_pending")}</div><div class="l">Tracking pending</div></div>
      <div class="stat"><div class="n" style="color:var(--muted)">${cnt(rows,"cancelled")}</div><div class="l">Cancelled</div></div>
    </div>
    <div class="dash-panels">
      <div class="panel">
        <h3>Branch-wise</h3>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Branch</th><th>Orders</th><th>Printed</th><th>Dispatched</th><th>Pending</th><th>Cancelled</th></tr></thead>
          <tbody>${byBranch.map(([n,r])=>`<tr><td>${esc(n)}</td><td>${r.length}</td><td>${printed(r)}</td><td>${cnt(r,"dispatched")}</td>
            <td>${cnt(r,"pending")+cnt(r,"courier_pending")}</td><td>${cnt(r,"cancelled")}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">No data</td></tr>`}</tbody>
        </table></div>
      </div>
      <div class="panel">
        <h3>Courier-wise &amp; speed</h3>
        ${byCourier.map(([k,n])=>`<div class="mini"><span>🚚 ${esc(k)}</span><b>${n}</b></div>`).join("") || `<div class="mini muted">No dispatches</div>`}
        <div class="mini"><span>Avg entry → print done</span><b>${avg(rows,"created_at","printed_at")}</b></div>
        <div class="mini"><span>Avg print done → dispatch</span><b>${avg(rows,"printed_at","dispatched_at")}</b></div>
      </div>
    </div>
    <div class="card" style="margin-top:1rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;">
        <h3 style="font-size:1rem;">Orders (${rows.length}) · ${esc(byLabel)} ${esc(ddmmyyyy(from))} → ${esc(ddmmyyyy(to))}</h3>
        <button class="btn sec sm" id="poRCsv">CSV</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Entry</th><th>Branch</th><th>Mobile</th><th>Details</th><th>Status</th><th>Print done</th><th>Dispatched</th><th>Courier</th><th>Tracking ID</th></tr></thead>
        <tbody>${rows.map(o=>`<tr class="${lateP(o)||lateC(o)?"low":""}"><td>${dtIST(o.created_at)}</td><td>${esc(branchName(o.branch_id))}</td>
          <td>${esc(fmtMobile(o.mobile))}</td><td style="white-space:normal;min-width:180px;">${esc(o.details)}</td><td>${PO_STATUS[o.status]}</td>
          <td>${o.printed_at?dtIST(o.printed_at):"—"}</td><td>${o.dispatched_at?dtIST(o.dispatched_at):"—"}</td>
          <td>${esc(partnerName(o))}</td><td>${esc(o.tracking_id||"")}</td></tr>`).join("") || `<tr><td colspan="9" class="muted">No orders in this range</td></tr>`}</tbody>
      </table></div>
    </div>`;
  $("#poRCsv").onclick = ()=>downloadCSV(`print_orders_${from}_${to}.csv`,
    [["Entry","Branch","Mobile","Details","Status","Print done","Print by","Dispatched","Dispatch by","Courier","Tracking ID","Cancel reason"],
     ...rows.map(o=>[dtIST(o.created_at),branchName(o.branch_id),o.mobile,o.details,PO_STATUS[o.status],
       o.printed_at?dtIST(o.printed_at):"",po.names[o.printed_by]||"",o.dispatched_at?dtIST(o.dispatched_at):"",po.names[o.dispatched_by]||"",
       partnerName(o),o.tracking_id||"",o.cancel_reason||""])]);
}

/* ---------------- Start ---------------- */
if(SUPABASE_URL.includes("YOUR-PROJECT")){
  show("login");
  toast("Set SUPABASE_URL and SUPABASE_ANON_KEY in index.html","bad",8000);
} else {
  boot().catch(e=>{ console.error(e); show("login"); toast("Startup error: "+e.message,"bad",6000); });
}
</script>
</body>
</html>
