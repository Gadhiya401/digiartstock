<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>DigiArt Stock Management</title>
<style>
  :root {
    --bg:#eef1f6; --card:#fff; --line:#e3e6ea; --text:#1c2430; --muted:#6b7480;
    --primary:#2563eb; --primary-d:#1d4ed8; --danger:#dc2626; --ok:#16a34a; --warn:#f59e0b;
    --radius:14px; --nav-w:220px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1,h2,h3 { margin:0 0 .5rem; }
  button { font:inherit; cursor:pointer; }
  input,select { font:inherit; width:100%; padding:.6rem .7rem; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--text); }
  input:focus,select:focus { outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary); }
  label { display:block; font-size:.8rem; color:var(--muted); margin:.5rem 0 .25rem; font-weight:600; }
  .btn { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:.7rem 1rem; font-weight:600; width:100%; }
  .btn:active { background:var(--primary-d); }
  .btn.sec { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .btn.sm { width:auto; padding:.45rem .7rem; font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1rem; margin-bottom:.9rem; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .app { max-width:680px; margin:0 auto; padding:0 .8rem 90px; }
  header { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line);
    padding:.7rem .9rem; display:flex; align-items:center; justify-content:space-between; }
  header .brand { font-weight:700; }
  header .chip { font-size:.72rem; background:#eef2ff; color:var(--primary-d); padding:.25rem .6rem; border-radius:999px; font-weight:700; }
  header .lo { background:none; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:.8rem; padding:.35rem .6rem; }
  nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--card); border-top:1px solid var(--line);
    display:flex; max-width:680px; margin:0 auto; }
  nav.tabs .navbrand { display:none; }
  nav.tabs button { flex:1; background:none; border:none; padding:.5rem 0 .6rem; color:var(--muted); font-size:.64rem; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px; border-radius:0; }
  nav.tabs button .i { font-size:1.05rem; }
  nav.tabs button.on { color:var(--primary); }

  /* ---------- Desktop / PC layout ---------- */
  @media (min-width:900px){
    body { background:var(--bg); }
    header { padding-left:calc(var(--nav-w) + 1.5rem); }
    nav.tabs { flex-direction:column; top:0; bottom:0; right:auto; width:var(--nav-w); max-width:none; margin:0;
      border-top:none; border-right:1px solid var(--line); padding:1rem .6rem; gap:.25rem; align-items:stretch; }
    nav.tabs .navbrand { display:block; font-weight:800; font-size:1.05rem; padding:.4rem .6rem 1rem; color:var(--text); }
    nav.tabs button { flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:.7rem; padding:.7rem .8rem;
      font-size:.9rem; border-radius:10px; }
    nav.tabs button .i { font-size:1.1rem; width:1.3rem; text-align:center; }
    nav.tabs button.on { background:#eef2ff; color:var(--primary-d); }
    nav.tabs button:hover { background:#f1f3f7; }
    .app { max-width:1080px; margin:0; padding:1.5rem 2rem 2rem calc(var(--nav-w) + 3rem); }
    #dashBody .grid2, #reportBody .grid2 { grid-template-columns:repeat(4,1fr); gap:1rem; }
    .card { padding:1.25rem; }
    #toast { left:auto; right:2rem; transform:none; bottom:2rem; }
  }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th,td { text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.02em; }
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  tr.low td { background:#fef2f2; color:var(--danger); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:.8rem; }
  .stat .n { font-size:1.5rem; font-weight:700; }
  .stat .l { font-size:.72rem; color:var(--muted); font-weight:600; }

  /* dashboard */
  .dash-hero { background:linear-gradient(135deg,#2563eb,#1e40af); color:#fff; border-radius:var(--radius);
    padding:1.25rem 1.4rem; margin-bottom:1rem; box-shadow:0 8px 24px rgba(37,99,235,.25); }
  .dash-hero .hi { font-size:.8rem; opacity:.85; font-weight:600; }
  .dash-hero .big2 { font-size:1.6rem; font-weight:800; margin-top:.15rem; }
  .dash-hero .sub { font-size:.82rem; opacity:.9; margin-top:.2rem; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem;
    position:relative; overflow:hidden; }
  .tile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,#2563eb); }
  .tile .ic { font-size:1.1rem; }
  .tile .n { font-size:1.7rem; font-weight:800; line-height:1.1; margin-top:.35rem; }
  .tile .l { font-size:.74rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1rem; margin-top:1rem; }
  .panel h3 { font-size:.95rem; display:flex; justify-content:space-between; align-items:center; }
  .mini { display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid var(--line); font-size:.88rem; }
  .mini:last-child { border-bottom:none; }
  .pill { font-size:.7rem; font-weight:700; padding:.15rem .5rem; border-radius:999px; }
  .pill.in { background:#dcfce7; color:#166534; } .pill.out { background:#fef3c7; color:#92400e; }
  @media (min-width:900px){ .dash-panels { display:grid; grid-template-columns:1fr 1fr; gap:1rem; } .dash-panels .panel { margin-top:0; } }
  .muted { color:var(--muted); }
  .err { color:var(--danger); font-size:.82rem; margin-top:.4rem; }
  .row-actions { display:flex; gap:.4rem; }
  .search-list { border:1px solid var(--line); border-radius:10px; margin-top:.25rem; max-height:190px; overflow:auto; }
  .search-list div { padding:.55rem .7rem; border-bottom:1px solid var(--line); }
  .search-list div:last-child { border-bottom:none; }
  .search-list div:active { background:#eef2ff; }
  .selbox { background:#f0f7ff; border:1px solid #cfe2ff; border-radius:10px; padding:.6rem .7rem; margin-top:.3rem; font-size:.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chips button { background:#fff; border:1px solid var(--line); border-radius:999px; padding:.35rem .7rem; font-size:.8rem; color:var(--text); }
  .chips button.on { background:var(--primary); color:#fff; border-color:var(--primary); }
  .big { font-size:2rem; font-weight:700; }
  #toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:.4rem; width:92%; max-width:520px; }
  .toast { padding:.7rem .9rem; border-radius:10px; color:#fff; font-size:.88rem; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  .toast.ok { background:var(--ok); } .toast.bad { background:var(--danger); } .toast.info { background:#334155; }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
  .spin { display:inline-block; width:18px; height:18px; border:3px solid #cbd5e1; border-top-color:var(--primary); border-radius:50%; animation:sp .7s linear infinite; vertical-align:middle; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .loading { text-align:center; color:var(--muted); padding:1.5rem; }
  .hide { display:none !important; }
</style>
</head>
<body>

<script>
  const SUPABASE_URL      = "https://mxuqybvqqidbtqubihbg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_jjmEZYSqsBk29xLRip6i1w_blYG8-U6";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<div id="toast"></div>

<!-- LOGIN -->
<div id="loginView" class="center hide">
  <div class="card" style="width:100%;max-width:380px;">
    <h1 style="font-size:1.3rem;">📦 DigiArt Stock Management</h1>
    <p class="muted" style="margin-top:0;font-size:.86rem;">Sign in to continue</p>
    <label>Email</label>
    <input id="liEmail" type="email" autocomplete="username" />
    <label>Password</label>
    <input id="liPass" type="password" autocomplete="current-password" />
    <div style="height:.8rem;"></div>
    <button class="btn" id="liBtn">Sign in</button>
    <div class="err" id="liErr"></div>
  </div>
</div>

<!-- BOOT / LOADING -->
<div id="bootView" class="center">
  <div><span class="spin"></span> <span class="muted">Loading…</span></div>
</div>

<!-- APP -->
<div id="appView" class="hide">
  <header>
    <span class="brand">📦 DigiArt Stock Management</span>
    <span style="display:flex;align-items:center;gap:.5rem;">
      <span class="chip" id="branchChip">—</span>
      <button class="lo" id="logoutBtn">Logout</button>
    </span>
  </header>

  <div class="app">
    <!-- DASHBOARD -->
    <section data-page="dash">
      <h2>Dashboard</h2>
      <div id="dashBody" class="loading"><span class="spin"></span> Loading…</div>
    </section>

    <!-- PRODUCTS -->
    <section data-page="products" class="hide">
      <h2>Products</h2>
      <div class="card">
        <h3 id="prodFormTitle" style="font-size:1rem;">Add product</h3>
        <input type="hidden" id="pId" />
        <div class="grid2">
          <div><label>Product No *</label><input id="pNo" /></div>
          <div><label>Name *</label><input id="pName" /></div>
          <div><label>Category</label><input id="pCat" /></div>
          <div><label>Unit</label><input id="pUnit" value="pcs" /></div>
          <div><label>Opening stock</label><input id="pOpen" type="number" inputmode="decimal" value="0" /></div>
          <div><label>Min stock</label><input id="pMin" type="number" inputmode="decimal" value="0" /></div>
        </div>
        <div style="height:.7rem;"></div>
        <button class="btn" id="pSave">Save product</button>
        <button class="btn sec hide" id="pCancel" style="margin-top:.4rem;">Cancel edit</button>
        <div class="err" id="pErr"></div>
      </div>
      <div class="card">
        <label>Search by number or name</label>
        <input id="prodSearch" placeholder="Type to filter…" />
        <div class="tbl-wrap" style="margin-top:.6rem;">
          <table><thead><tr><th>No</th><th>Name</th><th>Stock</th><th>Min</th><th></th></tr></thead>
          <tbody id="prodRows"></tbody></table>
        </div>
        <div id="prodListMsg" class="loading"><span class="spin"></span> Loading…</div>
      </div>
    </section>

    <!-- STOCK IN -->
    <section data-page="in" class="hide">
      <h2>Stock IN <span class="muted" style="font-size:.8rem;">(common — no branch)</span></h2>
      <div class="card" id="inForm"></div>
    </section>

    <!-- STOCK OUT -->
    <section data-page="out" class="hide">
      <h2>Stock OUT</h2>
      <div class="card" id="outForm"></div>
    </section>

    <!-- REPORTS -->
    <section data-page="report" class="hide">
      <h2>Reports / Hisab</h2>
      <div class="card">
        <label>Date range</label>
        <div class="chips" id="dateChips">
          <button data-r="today">Today</button>
          <button data-r="yday">Yesterday</button>
          <button data-r="week">This Week</button>
          <button data-r="month" class="on">This Month</button>
          <button data-r="lastmonth">Last Month</button>
          <button data-r="custom">Custom</button>
        </div>
        <div class="grid2" id="customRange" style="margin-top:.5rem;">
          <div><label>From</label><input id="rFrom" type="date" /></div>
          <div><label>To</label><input id="rTo" type="date" /></div>
        </div>
        <div class="grid2" style="margin-top:.3rem;">
          <div><label>Type</label><select id="rType"><option value="both">Both</option><option value="IN">IN</option><option value="OUT">OUT</option></select></div>
          <div><label>Branch</label><select id="rBranch"><option value="all">All</option><option value="DIGIART">DigiArt</option><option value="UVINVITE">UV Invite</option></select></div>
        </div>
        <label>Product number</label>
        <input id="rProd" placeholder="Optional — exact or partial" />
        <div style="height:.7rem;"></div>
        <button class="btn" id="rRun">Run report</button>
      </div>
      <div id="reportBody"></div>
    </section>

    <!-- STOCK CHECK -->
    <section data-page="check" class="hide">
      <h2>Stock Check</h2>
      <div class="card">
        <label>Product number or name</label>
        <input id="checkInput" placeholder="Type product number or name…" autocomplete="off" />
        <div id="checkResult" style="margin-top:.8rem;"></div>
      </div>
    </section>
  </div>

  <nav class="tabs" id="tabs">
    <span class="navbrand">📦 DigiArt Stock</span>
    <button data-go="dash" class="on"><span class="i">▤</span>Dashboard</button>
    <button data-go="products"><span class="i">▦</span>Products</button>
    <button data-go="in"><span class="i">▼</span>IN</button>
    <button data-go="out"><span class="i">▲</span>OUT</button>
    <button data-go="report"><span class="i">≣</span>Hisab</button>
    <button data-go="check"><span class="i">⌕</span>Check</button>
  </nav>
</div>

<script>
"use strict";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (Math.round((Number(n)||0)*100)/100).toLocaleString();
const todayISO = () => new Date().toISOString().slice(0,10);

function toast(msg,kind="info",ms=3000){
  const el=document.createElement("div");
  el.className="toast "+({ok:"ok",bad:"bad"}[kind]||"info");
  el.textContent=msg; $("#toast").appendChild(el);
  setTimeout(()=>el.remove(),ms);
}

const state = { user:null, profile:null, branch:null, branches:[], page:"dash" };

/* ---------------- Auth ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show("login"); return; }
  await loadIdentity(session.user);
}
async function loadIdentity(user){
  state.user = user;
  const [{ data:branches }, { data:profile }] = await Promise.all([
    sb.from("branches").select("*"),
    sb.from("profiles").select("*").eq("id",user.id).single()
  ]);
  state.branches = branches||[];
  state.profile = profile||null;
  state.branch = state.branches.find(b=>b.id===profile?.branch_id) || null;
  if(!state.branch){
    toast("Your login is not linked to a branch. See SETUP.md","bad",6000);
  }
  $("#branchChip").textContent = state.branch ? state.branch.name : "No branch";
  show("app");
  buildInForm(); buildOutForm();
  go("dash");
}
$("#liBtn").onclick = async ()=>{
  const email=$("#liEmail").value.trim(), password=$("#liPass").value;
  $("#liErr").textContent="";
  if(!email||!password){ $("#liErr").textContent="Enter email and password"; return; }
  $("#liBtn").disabled=true; $("#liBtn").textContent="Signing in…";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  $("#liBtn").disabled=false; $("#liBtn").textContent="Sign in";
  if(error){ $("#liErr").textContent=error.message; return; }
  show("boot");
  await loadIdentity(data.user);
};
$("#logoutBtn").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

function show(which){
  $("#bootView").classList.toggle("hide", which!=="boot");
  $("#loginView").classList.toggle("hide", which!=="login");
  $("#appView").classList.toggle("hide", which!=="app");
}

/* ---------------- Navigation ---------------- */
function go(page){
  state.page=page;
  $$("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.go===page));
  $$("section[data-page]").forEach(s=>s.classList.toggle("hide", s.dataset.page!==page));
  if(page==="dash") loadDash();
  if(page==="products") loadProducts();
  if(page==="in"||page==="out") refreshMoveForms();
  if(page==="check"){ $("#checkInput").value=""; $("#checkResult").innerHTML=""; $("#checkInput").focus(); }
}
$("#tabs").onclick = e => { const b=e.target.closest("button"); if(b) go(b.dataset.go); };

/* ---------------- Data helpers ---------------- */
async function getStockView(){
  const { data, error } = await sb.from("v_product_stock").select("*").order("product_no");
  if(error){ toast(error.message,"bad"); return []; }
  return data||[];
}
function branchCode(id){ return state.branches.find(b=>b.id===id)?.code || ""; }
function branchIdByCode(code){ return state.branches.find(b=>b.code===code)?.id || null; }

/* ---------------- Dashboard ---------------- */
async function loadDash(){
  const box=$("#dashBody");
  box.className="loading"; box.innerHTML='<span class="spin"></span> Loading…';
  const [stock, movesToday] = await Promise.all([
    getStockView(),
    sb.from("stock_moves").select("move_type,qty,branch_id,party,created_at,products(product_no,name)").eq("move_date",todayISO()).order("created_at",{ascending:false})
  ]);
  const rows = movesToday.data||[];
  const inQty = rows.filter(r=>r.move_type==="IN").reduce((a,r)=>a+Number(r.qty),0);
  const outRows = rows.filter(r=>r.move_type==="OUT");
  const outQty = outRows.reduce((a,r)=>a+Number(r.qty),0);
  const outD = outRows.filter(r=>branchCode(r.branch_id)==="DIGIART").reduce((a,r)=>a+Number(r.qty),0);
  const outU = outRows.filter(r=>branchCode(r.branch_id)==="UVINVITE").reduce((a,r)=>a+Number(r.qty),0);
  const totalStock = stock.reduce((a,r)=>a+Number(r.current_stock),0);
  const low = stock.filter(r=>r.low_stock).length;
  const lowList = stock.filter(r=>r.low_stock).sort((a,b)=>Number(a.current_stock)-Number(b.current_stock));
  const now=new Date();
  const hi = now.getHours()<12?"Good morning":now.getHours()<17?"Good afternoon":"Good evening";
  const t = d => new Date(d).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  box.className="";
  box.innerHTML = `
    <div class="dash-hero">
      <div class="hi">${hi}, ${esc(state.profile?.display_name||"there")} 👋</div>
      <div class="big2">${esc(state.branch?state.branch.name:"No branch")}</div>
      <div class="sub">${now.toLocaleDateString([], {weekday:"long", day:"numeric", month:"long", year:"numeric"})}</div>
    </div>
    <div class="grid2">
      <div class="tile" style="--accent:#2563eb"><div class="ic">📦</div><div class="n">${fmt(stock.length)}</div><div class="l">Products</div></div>
      <div class="tile" style="--accent:#0891b2"><div class="ic">🗃️</div><div class="n">${fmt(totalStock)}</div><div class="l">Current stock</div></div>
      <div class="tile" style="--accent:${low?'#dc2626':'#16a34a'}"><div class="ic">${low?'⚠️':'✅'}</div><div class="n" style="color:${low?'var(--danger)':'inherit'}">${fmt(low)}</div><div class="l">Low stock</div></div>
      <div class="tile" style="--accent:#16a34a"><div class="ic">⬇️</div><div class="n" style="color:var(--ok)">${fmt(inQty)}</div><div class="l">Today IN</div></div>
      <div class="tile" style="--accent:#f59e0b"><div class="ic">⬆️</div><div class="n" style="color:var(--warn)">${fmt(outQty)}</div><div class="l">Today OUT</div></div>
      <div class="tile" style="--accent:#6366f1"><div class="ic">🏷️</div>
        <div class="n" style="font-size:1rem;margin-top:.5rem;">DA ${fmt(outD)} &nbsp;·&nbsp; UV ${fmt(outU)}</div>
        <div class="l">Today OUT split</div></div>
    </div>
    <div class="dash-panels">
      <div class="panel">
        <h3>Low stock <span class="muted" style="font-weight:600;">${fmt(lowList.length)} items</span></h3>
        ${lowList.length ? lowList.slice(0,8).map(r=>`<div class="mini">
          <span>${esc(r.product_no)} — ${esc(r.name)}</span>
          <span style="color:var(--danger);font-weight:700;">${fmt(r.current_stock)} / ${fmt(r.min_stock)}</span></div>`).join("")
          : `<div class="muted" style="padding:.5rem 0;">All good — nothing low 🎉</div>`}
      </div>
      <div class="panel">
        <h3>Today's activity <span class="muted" style="font-weight:600;">${fmt(rows.length)}</span></h3>
        ${rows.length ? rows.slice(0,8).map(m=>`<div class="mini">
          <span><span class="pill ${m.move_type==='IN'?'in':'out'}">${m.move_type}</span>
            ${esc(m.products?.product_no||"")} ${esc(m.products?.name||"")}</span>
          <span class="muted">${fmt(m.qty)} · ${t(m.created_at)}</span></div>`).join("")
          : `<div class="muted" style="padding:.5rem 0;">No movements yet today</div>`}
      </div>
    </div>`;
}

/* ---------------- Products ---------------- */
let productCache = [];
async function loadProducts(){
  const msg=$("#prodListMsg");
  msg.className="loading"; msg.innerHTML='<span class="spin"></span> Loading…'; msg.classList.remove("hide");
  productCache = await getStockView();
  msg.classList.add("hide");
  renderProdRows();
}
function renderProdRows(){
  const q=$("#prodSearch").value.trim().toLowerCase();
  const list = productCache.filter(p=>!q || p.product_no.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
  $("#prodRows").innerHTML = list.map(p=>`
    <tr class="${p.low_stock?'low':''}">
      <td>${esc(p.product_no)}</td><td>${esc(p.name)}</td>
      <td>${fmt(p.current_stock)} ${esc(p.unit||'')}</td><td>${fmt(p.min_stock)}</td>
      <td><button class="btn sec sm" data-edit="${p.product_id}">Edit</button></td>
    </tr>`).join("") || `<tr><td colspan="5" class="muted">No products</td></tr>`;
}
$("#prodSearch").oninput = renderProdRows;
$("#prodRows").onclick = async e => {
  const id=e.target.dataset.edit; if(!id) return;
  const { data } = await sb.from("products").select("*").eq("id",id).single();
  if(!data) return;
  $("#pId").value=data.id; $("#pNo").value=data.product_no; $("#pName").value=data.name;
  $("#pCat").value=data.category||""; $("#pUnit").value=data.unit||"pcs";
  $("#pOpen").value=data.opening_stock; $("#pMin").value=data.min_stock;
  $("#prodFormTitle").textContent="Edit product";
  $("#pCancel").classList.remove("hide");
  window.scrollTo({top:0,behavior:"smooth"});
};
$("#pCancel").onclick = resetProdForm;
function resetProdForm(){
  $("#pId").value=""; $("#pNo").value=""; $("#pName").value=""; $("#pCat").value="";
  $("#pUnit").value="pcs"; $("#pOpen").value="0"; $("#pMin").value="0"; $("#pErr").textContent="";
  $("#prodFormTitle").textContent="Add product"; $("#pCancel").classList.add("hide");
}
$("#pSave").onclick = async ()=>{
  $("#pErr").textContent="";
  const rec = {
    product_no:$("#pNo").value.trim(), name:$("#pName").value.trim(),
    category:$("#pCat").value.trim()||null, unit:$("#pUnit").value.trim()||"pcs",
    opening_stock:Number($("#pOpen").value)||0, min_stock:Number($("#pMin").value)||0
  };
  if(!rec.product_no||!rec.name){ $("#pErr").textContent="Product No and Name are required"; return; }
  $("#pSave").disabled=true;
  const id=$("#pId").value;
  const q = id ? sb.from("products").update(rec).eq("id",id) : sb.from("products").insert(rec);
  const { error } = await q;
  $("#pSave").disabled=false;
  if(error){ $("#pErr").textContent=error.message; return; }
  toast(id?"Product updated":"Product added","ok");
  resetProdForm(); loadProducts();
};

/* ---------------- Product picker (shared by IN/OUT/Check) ---------------- */
function productPicker(prefix){
  // returns {get:()=>selectedStockRow|null, reset, mount}
  let selected=null; let rows=[];
  const wrap=document.createElement("div");
  wrap.innerHTML=`
    <label>Product (search by number)</label>
    <input id="${prefix}Search" placeholder="Type product number or name…" autocomplete="off" />
    <div class="search-list hide" id="${prefix}List"></div>
    <div class="selbox hide" id="${prefix}Sel"></div>`;
  const input=()=>$("#"+prefix+"Search",wrap);
  const listEl=()=>$("#"+prefix+"List",wrap);
  const selEl=()=>$("#"+prefix+"Sel",wrap);
  async function ensure(){ if(!rows.length) rows=await getStockView(); }
  input().addEventListener("input", async ()=>{
    selected=null; selEl().classList.add("hide");
    const q=input().value.trim().toLowerCase();
    if(!q){ listEl().classList.add("hide"); return; }
    await ensure();
    const m=rows.filter(r=>r.product_no.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)).slice(0,20);
    listEl().innerHTML = m.map(r=>`<div data-id="${r.product_id}"><b>${esc(r.product_no)}</b> — ${esc(r.name)}<br><span class="muted">Stock: ${fmt(r.current_stock)} ${esc(r.unit||'')}</span></div>`).join("") || `<div class="muted">No match</div>`;
    listEl().classList.remove("hide");
  });
  listEl().addEventListener("click", e=>{
    const d=e.target.closest("[data-id]"); if(!d) return;
    selected=rows.find(r=>r.product_id===d.dataset.id);
    listEl().classList.add("hide"); input().value=selected.product_no;
    selEl().innerHTML=`<b>${esc(selected.name)}</b><br>Current stock: <b>${fmt(selected.current_stock)}</b> ${esc(selected.unit||'')}
      &nbsp;·&nbsp; DigiArt OUT ${fmt(selected.out_digiart)} · UV OUT ${fmt(selected.out_uvinvite)}`;
    selEl().classList.remove("hide");
  });
  return {
    node:wrap,
    get:()=>selected,
    async refresh(){ rows=await getStockView(); if(selected) selected=rows.find(r=>r.product_id===selected.product_id)||selected; },
    reset(){ selected=null; input().value=""; listEl().classList.add("hide"); selEl().classList.add("hide"); }
  };
}

let inPicker, outPicker;
function buildInForm(){
  const c=$("#inForm"); c.innerHTML="";
  inPicker=productPicker("in"); c.appendChild(inPicker.node);
  c.insertAdjacentHTML("beforeend",`
    <div class="grid2" style="margin-top:.5rem;">
      <div><label>Quantity *</label><input id="inQty" type="number" inputmode="decimal" min="0" step="any" /></div>
      <div><label>Date</label><input id="inDate" type="date" value="${todayISO()}" /></div>
    </div>
    <label>Supplier / Party</label><input id="inParty" />
    <label>Note</label><input id="inNote" />
    <div style="height:.7rem;"></div>
    <button class="btn" id="inSave">Save IN entry</button>
    <div class="err" id="inErr"></div>`);
  $("#inSave").onclick = ()=>saveMove("IN");
}
function buildOutForm(){
  const c=$("#outForm"); c.innerHTML="";
  const chip=document.createElement("div");
  chip.className="selbox";
  chip.innerHTML=`Branch (from your login): <b>${esc(state.branch?state.branch.name:"— not linked —")}</b>`;
  c.appendChild(chip);
  outPicker=productPicker("out"); c.appendChild(outPicker.node);
  c.insertAdjacentHTML("beforeend",`
    <div class="grid2" style="margin-top:.5rem;">
      <div><label>Quantity *</label><input id="outQty" type="number" inputmode="decimal" min="0" step="any" /></div>
      <div><label>Date</label><input id="outDate" type="date" value="${todayISO()}" /></div>
    </div>
    <label>Customer / Order no</label><input id="outParty" />
    <label>Note</label><input id="outNote" />
    <div style="height:.7rem;"></div>
    <button class="btn" id="outSave">Save OUT entry</button>
    <div class="err" id="outErr"></div>`);
  $("#outSave").onclick = ()=>saveMove("OUT");
}
async function refreshMoveForms(){
  if(inPicker) await inPicker.refresh();
  if(outPicker) await outPicker.refresh();
}
async function saveMove(type){
  const p = type==="IN"?"in":"out";
  const picker = type==="IN"?inPicker:outPicker;
  const errEl=$("#"+p+"Err"); errEl.textContent="";
  const sel=picker.get();
  const qty=Number($("#"+p+"Qty").value);
  const date=$("#"+p+"Date").value||todayISO();
  if(!sel){ errEl.textContent="Pick a product first"; return; }
  if(!qty||qty<=0){ errEl.textContent="Enter a valid quantity"; return; }
  if(type==="OUT"){
    if(!state.branch){ errEl.textContent="Your login is not linked to a branch — cannot record OUT"; return; }
    // re-check live stock
    await picker.refresh();
    const live=picker.get();
    if(qty > Number(live.current_stock)){
      errEl.textContent=`Not enough stock. Available: ${fmt(live.current_stock)} ${live.unit||''}`;
      return;
    }
  }
  const rec = {
    product_id: sel.product_id, move_type:type, qty,
    branch_id: type==="OUT" ? state.branch.id : null,
    party: $("#"+p+"Party").value.trim()||null,
    note: $("#"+p+"Note").value.trim()||null,
    created_by: state.user.id,
    move_date: date
  };
  $("#"+p+"Save").disabled=true;
  const { error } = await sb.from("stock_moves").insert(rec);
  $("#"+p+"Save").disabled=false;
  if(error){ errEl.textContent=error.message; return; }
  toast(`${type} entry saved`,"ok");
  picker.reset();
  $("#"+p+"Qty").value=""; $("#"+p+"Party").value=""; $("#"+p+"Note").value="";
}

/* ---------------- Stock Check ---------------- */
let checkRows=[], checkTimer=null;
$("#checkInput").oninput = ()=>{
  clearTimeout(checkTimer);
  checkTimer=setTimeout(runCheck,180);
};
async function runCheck(){
  const q=$("#checkInput").value.trim().toLowerCase();
  const out=$("#checkResult");
  if(!q){ out.innerHTML=""; return; }
  if(!checkRows.length){
    out.innerHTML='<div class="loading"><span class="spin"></span> Loading…</div>';
    checkRows=await getStockView();
  }
  const m=checkRows.filter(r=>r.product_no.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)).slice(0,8);
  if(!m.length){ out.innerHTML='<div class="muted">No product found</div>'; return; }
  out.innerHTML=m.map(r=>`
    <div class="card" style="margin-bottom:.6rem;">
      <div class="muted" style="font-size:.8rem;">${esc(r.product_no)}</div>
      <div style="font-weight:700;font-size:1.05rem;">${esc(r.name)}</div>
      <div class="big" style="color:${r.low_stock?'var(--danger)':'var(--ok)'}">${fmt(r.current_stock)} <span style="font-size:.9rem;color:var(--muted)">${esc(r.unit||'')}</span></div>
      <div class="muted" style="font-size:.85rem;">OUT — DigiArt: <b>${fmt(r.out_digiart)}</b> · UV Invite: <b>${fmt(r.out_uvinvite)}</b> · Total IN: <b>${fmt(r.total_in)}</b></div>
    </div>`).join("");
}

/* ---------------- Reports ---------------- */
let rRange="month";
$("#dateChips").onclick = e=>{
  const b=e.target.closest("button"); if(!b) return;
  rRange=b.dataset.r;
  $$("#dateChips button").forEach(x=>x.classList.toggle("on",x===b));
  $("#customRange").style.display = rRange==="custom" ? "grid" : "none";
};
$("#customRange").style.display="none";
function rangeDates(){
  const d=new Date(); d.setHours(0,0,0,0);
  const iso=x=>x.toISOString().slice(0,10);
  const s=new Date(d);
  if(rRange==="today") return [iso(d),iso(d)];
  if(rRange==="yday"){ s.setDate(s.getDate()-1); return [iso(s),iso(s)]; }
  if(rRange==="week"){ s.setDate(s.getDate()-((s.getDay()+6)%7)); return [iso(s),iso(d)]; }
  if(rRange==="month"){ s.setDate(1); return [iso(s),iso(d)]; }
  if(rRange==="lastmonth"){
    const a=new Date(d.getFullYear(),d.getMonth()-1,1);
    const b=new Date(d.getFullYear(),d.getMonth(),0);
    return [iso(a),iso(b)];
  }
  return [$("#rFrom").value||iso(d), $("#rTo").value||iso(d)];
}
let lastReport=null;
$("#rRun").onclick = async ()=>{
  const [from,to]=rangeDates();
  const type=$("#rType").value, branchSel=$("#rBranch").value, prodQ=$("#rProd").value.trim().toLowerCase();
  const body=$("#reportBody");
  body.innerHTML='<div class="loading"><span class="spin"></span> Running…</div>';

  let query = sb.from("stock_moves")
    .select("move_type,qty,branch_id,party,note,move_date,created_by,products(product_no,name,unit)")
    .gte("move_date",from).lte("move_date",to).order("move_date",{ascending:false});
  if(type!=="both") query=query.eq("move_type",type);
  const { data, error } = await query;
  if(error){ body.innerHTML=`<div class="err">${esc(error.message)}</div>`; return; }

  // profiles for user names
  const { data:profs } = await sb.from("profiles").select("id,display_name");
  const pname = id => profs?.find(p=>p.id===id)?.display_name || "—";

  let moves = (data||[]).map(m=>({
    ...m,
    product_no:m.products?.product_no||"", name:m.products?.name||"", unit:m.products?.unit||"",
    bcode:branchCode(m.branch_id)
  }));
  if(branchSel!=="all") moves=moves.filter(m=> m.move_type==="OUT" ? m.bcode===branchSel : true);
  if(prodQ) moves=moves.filter(m=>m.product_no.toLowerCase().includes(prodQ)||m.name.toLowerCase().includes(prodQ));

  const tIn = moves.filter(m=>m.move_type==="IN").reduce((a,m)=>a+Number(m.qty),0);
  const outM = moves.filter(m=>m.move_type==="OUT");
  const tOut = outM.reduce((a,m)=>a+Number(m.qty),0);
  const tD = outM.filter(m=>m.bcode==="DIGIART").reduce((a,m)=>a+Number(m.qty),0);
  const tU = outM.filter(m=>m.bcode==="UVINVITE").reduce((a,m)=>a+Number(m.qty),0);

  // product-wise
  const byProd={};
  for(const m of moves){
    const k=m.product_no||m.name;
    byProd[k] = byProd[k] || {product_no:m.product_no,name:m.name,in:0,outD:0,outU:0};
    if(m.move_type==="IN") byProd[k].in+=Number(m.qty);
    else if(m.bcode==="DIGIART") byProd[k].outD+=Number(m.qty);
    else if(m.bcode==="UVINVITE") byProd[k].outU+=Number(m.qty);
  }
  const stock = await getStockView();
  const closingOf = no => stock.find(s=>s.product_no===no)?.current_stock ?? "";

  const prodRows = Object.values(byProd).sort((a,b)=>a.product_no.localeCompare(b.product_no));

  lastReport = {
    summary:[["Metric","Qty"],["Total IN",tIn],["Total OUT",tOut],["OUT DigiArt",tD],["OUT UV Invite",tU]],
    prodRows, moves, pname
  };

  body.innerHTML = `
    <div class="grid2">
      <div class="stat"><div class="n" style="color:var(--ok)">${fmt(tIn)}</div><div class="l">Total IN</div></div>
      <div class="stat"><div class="n" style="color:var(--warn)">${fmt(tOut)}</div><div class="l">Total OUT</div></div>
      <div class="stat"><div class="n">${fmt(tD)}</div><div class="l">OUT DigiArt</div></div>
      <div class="stat"><div class="n">${fmt(tU)}</div><div class="l">OUT UV Invite</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="font-size:1rem;">Product-wise (${esc(from)} → ${esc(to)})</h3>
        <button class="btn sec sm" id="csvProd">CSV</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>No</th><th>Name</th><th>IN</th><th>OUT DA</th><th>OUT UV</th><th>Total OUT</th><th>Closing</th></tr></thead>
        <tbody>${prodRows.map(r=>`<tr><td>${esc(r.product_no)}</td><td>${esc(r.name)}</td>
          <td>${fmt(r.in)}</td><td>${fmt(r.outD)}</td><td>${fmt(r.outU)}</td><td>${fmt(r.outD+r.outU)}</td>
          <td>${fmt(closingOf(r.product_no))}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No data</td></tr>`}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="font-size:1rem;">Movements (${fmt(moves.length)})</h3>
        <button class="btn sec sm" id="csvMoves">CSV</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>Branch</th><th>Party</th><th>User</th></tr></thead>
        <tbody>${moves.map(m=>`<tr><td>${esc(m.move_date)}</td><td>${esc(m.product_no)} ${esc(m.name)}</td>
          <td>${m.move_type}</td><td>${fmt(m.qty)}</td>
          <td>${m.move_type==="OUT"?esc(m.bcode==="DIGIART"?"DigiArt":m.bcode==="UVINVITE"?"UV Invite":"—"):"common"}</td>
          <td>${esc(m.party||"")}</td><td>${esc(pname(m.created_by))}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No movements</td></tr>`}</tbody>
      </table></div>
    </div>`;
  $("#csvProd").onclick = ()=>downloadCSV("product_summary.csv",
    [["No","Name","IN","OUT DigiArt","OUT UV Invite","Total OUT","Closing"],
     ...prodRows.map(r=>[r.product_no,r.name,r.in,r.outD,r.outU,r.outD+r.outU,closingOf(r.product_no)])]);
  $("#csvMoves").onclick = ()=>downloadCSV("movements.csv",
    [["Date","Product No","Name","Type","Qty","Branch","Party","Note","User"],
     ...moves.map(m=>[m.move_date,m.product_no,m.name,m.move_type,m.qty,
       m.move_type==="OUT"?m.bcode:"COMMON",m.party||"",m.note||"",pname(m.created_by)])]);
};
function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(c=>{
    const s=String(c??""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------------- Start ---------------- */
if(SUPABASE_URL.includes("YOUR-PROJECT")){
  show("login");
  toast("Set SUPABASE_URL and SUPABASE_ANON_KEY in index.html","bad",8000);
} else {
  boot().catch(e=>{ console.error(e); show("login"); toast("Startup error: "+e.message,"bad",6000); });
}
</script>
